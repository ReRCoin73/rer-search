<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReR Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --border-color: #e8eaed;
            --accent-color: #d4af37;
            --muted-color: #9aa0a6;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #121212;
                --border-color: #121212;
                --accent-color: #b8860b;
                --muted-color: #5f6368;
            }
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4vh;
            margin-bottom: 4px;
        }
        .brand-title {
            font-size: 3.1rem;
            font-weight: bold;
            margin: 0;
        }
        .rer-part { color: var(--accent-color); }
        .slogan {
            font-family: 'Times New Roman', Times, serif;
            color: var(--muted-color);
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin: 2px 0 26px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border-color);
            border-radius: 28px;
            padding-right: 15px;
            background: rgba(255, 255, 255, 0.03);
        }
        @media (min-width: 900px) { .search-box { max-width: 720px; } }
        @media (max-width: 480px) {
            .search-box { max-width: 92vw; border-radius: 24px; }
            .search-input { padding: 12px 16px; font-size: 1rem; }
            .header-container { margin-top: 3vh; }
            .brand-title { font-size: 2.5rem; }
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 20px;
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
            min-width: 0;
        }
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.listening svg { fill: var(--accent-color); }
        .icon-btn svg { width: 22px; height: 22px; fill: var(--text-color); }

        /* ---- Widgets da tela inicial (somem quando há resultado de busca) ---- */
        .home-widgets {
            width: 100%;
            max-width: 600px;
            margin-top: 28px;
        }
        @media (min-width: 900px) { .home-widgets { max-width: 720px; } }
        @media (max-width: 480px) { .home-widgets { max-width: 92vw; } }
        .home-widgets.hidden { display: none; }

        .coin-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 560px) { .coin-row { grid-template-columns: repeat(4, 1fr); } }
        .coin-card {
            position: relative;
            border-radius: 16px;
            padding: 14px 16px;
            background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .coin-card.rerc-card {
            border-color: rgba(212,175,55,0.5);
            background: linear-gradient(160deg, rgba(212,175,55,0.12), rgba(212,175,55,0.02));
        }
        .coin-ticker { font-weight: bold; font-size: 0.92rem; letter-spacing: 0.3px; opacity: 0.95; }
        .coin-price { font-size: 0.78rem; opacity: 0.6; margin-top: 3px; }
        .coin-change { font-size: 1.05rem; font-weight: bold; margin-top: 5px; }
        .coin-change.up { color: #4caf50; }
        .coin-change.down { color: #e05252; }
        .coin-spark { width: 100%; height: 30px; margin-top: 8px; display: block; opacity: 0.9; }

        /* ---- Conversor ---- */
        .converter-box {
            margin-top: 22px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
        }
        .converter-title { font-size: 0.95rem; opacity: 0.75; margin-bottom: 10px; }
        .converter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .converter-row:last-child { margin-bottom: 0; }
        .swap-btn {
            display: block;
            margin: -2px auto 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
        }
        .swap-btn:hover { background: rgba(212,175,55,0.12); }
        .converter-amount {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }
        .converter-select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            max-width: 42%;
        }
        .converter-select option { color: #000; }
        .converter-note { font-size: 0.75rem; opacity: 0.55; margin-top: 8px; text-align: center; }

        /* ---- Resultados da busca ---- */
        .results-container {
            width: 100%;
            max-width: 600px;
            margin-top: 22px;
        }
        @media (min-width: 900px) { .results-container { max-width: 720px; } }
        @media (max-width: 480px) { .results-container { max-width: 92vw; } }

        .result-link {
            display: block;
            padding: 14px 4px;
            margin-bottom: 22px;
            text-decoration: none;
            color: inherit;
        }
        .result-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .result-favicon { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
        .result-url { font-size: 0.85rem; opacity: 0.65; word-break: break-all; }
        .result-name {
            font-weight: bold; font-size: 1.2rem; color: var(--accent-color);
            display: block; line-height: 1.3;
        }
        .result-link:hover .result-name { text-decoration: underline; }
        .result-name .badge-new {
            font-size: 0.6rem; color: var(--bg-color); background: var(--accent-color);
            border-radius: 8px; padding: 2px 7px; margin-left: 8px; vertical-align: middle;
        }
        .result-desc { font-size: 0.92rem; opacity: 0.85; margin-top: 5px; line-height: 1.45; }
        .no-results { opacity: 0.7; font-size: 0.95rem; text-align: center; }
        .badge-official {
            font-size: 0.68rem; color: var(--accent-color); border: 1px solid var(--accent-color);
            border-radius: 8px; padding: 1px 7px; margin-left: 4px;
        }

        .answer-box {
            border: 1.5px solid var(--accent-color);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 24px;
            background: rgba(212,175,55,0.06);
        }
        .answer-box-label { font-size: 0.78rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .answer-box-text { font-size: 1.05rem; line-height: 1.5; }
        .answer-box-source { font-size: 0.8rem; opacity: 0.6; margin-top: 8px; }

        .ai-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px;
            border: 1.5px solid var(--accent-color);
            border-radius: 16px;
            padding: 16px 18px;
            background: linear-gradient(160deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
        }
        @media (min-width: 900px) { .ai-box { max-width: 720px; } }
        @media (max-width: 480px) { .ai-box { max-width: 92vw; } }
        .ai-box-label { font-size: 0.78rem; opacity: 0.7; margin-bottom: 8px; }
        .ai-box-text { font-size: 1rem; line-height: 1.55; white-space: pre-wrap; }
        .ai-chat-log { margin-top: 10px; }
        .ai-chat-msg { font-size: 0.92rem; line-height: 1.5; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); white-space: pre-wrap; }
        .ai-chat-msg.user { color: var(--accent-color); font-weight: bold; }
        .ai-chat-row { display: flex; gap: 8px; margin-top: 12px; }
        .ai-chat-input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
        }

        /* Dropdown de autocomplete (estilo Google) */
        .search-wrap { position: relative; width: 100%; max-width: 600px; }
        @media (min-width: 900px) { .search-wrap { max-width: 720px; } }
        @media (max-width: 480px) { .search-wrap { max-width: 92vw; } }
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: var(--bg-color);
            border: 1.5px solid var(--accent-color);
            border-radius: 14px;
            overflow: hidden;
            z-index: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
        }
        .autocomplete-dropdown.active { display: block; }
        .autocomplete-item {
            padding: 12px 18px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-color);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item.highlighted { background: rgba(212,175,55,0.15); }

        /* Modal do scanner */
        .scanner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scanner-overlay.active { display: flex; }
        .scanner-video {
            width: min(92vw, 480px);
            max-height: 65vh;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            background: #000;
        }
        .scanner-actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
        .scanner-btn {
            font-family: inherit;
            background: transparent;
            border: 1.5px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .scanner-btn:hover { background: rgba(212,175,55,0.12); }
        .scanner-status {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-color);
            max-width: 90vw;
            text-align: center;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="header-container" id="homeLink" onclick="goHome()" style="cursor:pointer;">
        <h1 class="brand-title"><span class="rer-part">ReR</span> Search</h1>
    </div>
    <div class="slogan">® ReR Coin • Ecosystem</div>

    <div class="search-wrap">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar ativos, contratos ou tokens..." autocomplete="off">
            <button class="icon-btn" id="clearBtn" onclick="clearSearchInput()" title="Limpar" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <button class="icon-btn" id="voiceBtn" onclick="startVoice()" title="Voz">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.9 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.51-.4-.9-.9-.9s-.9.39-.9.9c0 3.16 2.41 5.76 5.5 6.21V21h2v-3.79c3.09-.45 5.5-3.05 5.5-6.21 0-.51-.41-.9-.9-.9z"/></svg>
            </button>
            <button class="icon-btn" id="scannerBtn" onclick="startScanner()" title="Scanner">
                <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2m16-2h-4v2h4v4h2V5a2 2 0 0 0-2-2M3 19v-4h2v4h4v2H5a2 2 0 0 1-2-2m18 0a2 2 0 0 1-2 2h-4v-2h4v-4h2M7 7h10v10H7V7Z"/></svg>
            </button>
        </div>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
    </div>

    <!-- Widgets da tela inicial: 4 cards + conversor. Somem quando há busca. -->
    <div class="home-widgets" id="homeWidgets">
        <div class="coin-row" id="coinRow">
            <div class="coin-card" data-coin="bitcoin"><div class="coin-ticker">BTC</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card" data-coin="polygon-ecosystem-token"><div class="coin-ticker">POL</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card" data-coin="solana"><div class="coin-ticker">SOL</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card" data-coin="ethereum"><div class="coin-ticker">ETH</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
        </div>

        <div class="converter-box">
            <div class="converter-title">Conversor</div>
            <div class="converter-row">
                <input type="number" id="convAmountFrom" class="converter-amount" value="1">
                <select id="convFrom" class="converter-select"></select>
            </div>
            <button type="button" class="swap-btn" id="swapBtn" title="Trocar de lugar">⇅</button>
            <div class="converter-row">
                <input type="text" id="convAmountTo" class="converter-amount" readonly>
                <select id="convTo" class="converter-select"></select>
            </div>
            <div class="converter-note" id="convNote">Cotações de mercado, apenas referência.</div>
        </div>
    </div>

    <div class="ai-box" id="aiBox" style="display:none;">
        <div class="ai-box-label">🤖 Resposta da IA — foco em mercado/cripto</div>
        <div class="ai-box-text" id="aiBoxText"></div>
        <div class="ai-chat-log" id="aiChatLog"></div>
        <div class="ai-chat-row">
            <input type="text" id="aiChatInput" class="ai-chat-input" placeholder="Perguntar mais sobre isso...">
            <button class="scanner-btn" id="aiChatSendBtn">Enviar</button>
        </div>
    </div>

    <div class="results-container" id="resultsContainer"></div>

    <!-- Modal do scanner (QR code + texto), estilo Google Lens -->
    <div class="scanner-overlay" id="scannerOverlay">
        <video id="scannerVideo" class="scanner-video" autoplay playsinline muted></video>
        <canvas id="scannerCanvas" style="display:none;"></canvas>
        <div class="scanner-status" id="scannerStatus">Aponte a câmera para um QR Code ou texto</div>
        <input type="file" id="galleryInput" accept="image/*" style="display:none;">
        <div class="scanner-actions">
            <button class="scanner-btn" onclick="captureText()">Capturar texto</button>
            <button class="scanner-btn" onclick="document.getElementById('galleryInput').click()" title="Escolher da galeria">🖼️ Galeria</button>
            <button class="scanner-btn" onclick="closeScanner()">Fechar</button>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIGURAÇÃO — preencher quando tiver as chaves.
        // =====================================================================
        // Serper.dev (busca ampla no Google, filtrada em sites de mercado/cripto): serper.dev -> conta grátis -> API key.
        const SERPER_API_KEY = "32ae43fa233c01d6867bd876d2cb83d9661397d4"; // <-- cole aqui a chave da Serper.dev
        const GEMINI_API_KEY = "AQ.Ab8RN6J4FetM19AdXkSiHOznPmpWRTzzCZsrj5p1kMmbLR_y-w"; // <-- IA de conversa
        const resultsContainer = document.getElementById('resultsContainer');
        const homeWidgets = document.getElementById('homeWidgets');

        // Sites oficiais conhecidos — atalho garantido, mostrado sempre em primeiro lugar
        // quando o termo bate exato, sem depender da ordenação do motor de busca.
        const CURATED_OFFICIAL_SITES = {
            bitcoin: 'https://bitcoin.org', btc: 'https://bitcoin.org',
            ethereum: 'https://ethereum.org', eth: 'https://ethereum.org',
            solana: 'https://solana.com', sol: 'https://solana.com',
            polygon: 'https://polygon.technology',
            polygonscan: 'https://polygonscan.com', poliscan: 'https://polygonscan.com', poliscano: 'https://polygonscan.com',
            etherscan: 'https://etherscan.io',
            bscscan: 'https://bscscan.com',
            solscan: 'https://solscan.io',
            binance: 'https://www.binance.com',
            coinbase: 'https://www.coinbase.com',
            kraken: 'https://www.kraken.com',
            okx: 'https://www.okx.com',
            bybit: 'https://www.bybit.com',
            uniswap: 'https://uniswap.org',
            metamask: 'https://metamask.io',
            coingecko: 'https://www.coingecko.com',
            coinmarketcap: 'https://coinmarketcap.com',
            dexscreener: 'https://dexscreener.com',
            geckoterminal: 'https://www.geckoterminal.com',
            tether: 'https://tether.to', usdt: 'https://tether.to',
            bnb: 'https://www.bnbchain.org',
            xrp: 'https://ripple.com', ripple: 'https://ripple.com',
            cardano: 'https://cardano.org', ada: 'https://cardano.org',
            dogecoin: 'https://dogecoin.com', doge: 'https://dogecoin.com',
            tron: 'https://trondao.org'
        };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function normalize(str) {
            return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        // =====================================================================
        // Busca ampla (Serper.dev / Google) — a busca vai direto pro motor, sem lista de
        // domínio nem filtro de palavra-chave por cima (isso vinha travando pergunta em
        // linguagem natural tipo "melhor token para investir"). Só a apresentação visual
        // (ícone, título, descrição) é nossa; o que aparece é o que o motor manda.
        // =====================================================================
        function favicon(url, size) {
            try {
                const domain = new URL(url).hostname;
                return 'https://www.google.com/s2/favicons?sz=' + (size || 32) + '&domain=' + domain;
            } catch (e) {
                return '';
            }
        }

        // Único filtro da busca aberta: precisa ter a ver com finanças/negócios/mercado/cripto
        // no sentido amplo. Não restringe nenhum site — qualquer domínio pode aparecer, desde
        // que o conteúdo seja sobre esse nicho. Isso evita tanto assunto totalmente fora do
        // tema quanto homônimo tipo "RERC" virar um centro de pesquisa de reabilitação dos EUA.
        const FINANCE_TOPIC_KEYWORDS = [
            "crypto", "criptomoeda", "token", "coin", "moeda", "blockchain", "cripto",
            "wallet", "carteira", "dex", "exchange", "corretora", "trading", "invest",
            "preco", "preço", "cotacao", "cotação", "mercado", "market", "financ",
            "economia", "economic", "money", "dinheiro", "bank", "banco", "stock",
            "acao", "ação", "bolsa", "negocio", "negócio", "business", "capital",
            "fund", "fundo", "asset", "ativo", "currency", "cambio", "câmbio"
        ];

        async function fetchWebResults(query, page) {
            if (!SERPER_API_KEY) return { results: [], answerBox: null };
            try {
                const res = await fetch('https://google.serper.dev/search', {
                    method: 'POST',
                    headers: {
                        'X-API-KEY': SERPER_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ q: query, num: 10, page: page || 1, hl: 'pt-br', gl: 'br' })
                });
                const data = await res.json();
                const results = (data.organic || [])
                    .map(item => ({
                        url: item.link,
                        title: item.title,
                        content: item.snippet || ''
                    }))
                    .filter(r => {
                        const haystack = normalize(r.title + ' ' + r.content);
                        return FINANCE_TOPIC_KEYWORDS.some(k => haystack.includes(k));
                    });
                return { results, answerBox: data.answerBox || null };
            } catch (err) {
                return { results: [], answerBox: null };
            }
        }

        function renderWebResult(r) {
            const link = document.createElement('a');
            link.className = 'result-link';
            link.href = r.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const domain = (() => { try { return new URL(r.url).hostname; } catch (e) { return r.url; } })();
            const icon = favicon(r.url);
            link.innerHTML =
                '<div class="result-top">' +
                    (icon ? '<img src="' + icon + '" class="result-favicon" alt="" loading="lazy">' : '') +
                    '<span class="result-url">' + escapeHtml(domain) + '</span>' +
                '</div>' +
                '<span class="result-name">' + escapeHtml(r.title || domain) + '</span>' +
                '<div class="result-desc">' + escapeHtml((r.content || '').slice(0, 160)) + (r.content && r.content.length > 160 ? '…' : '') + '</div>';
            resultsContainer.appendChild(link);
        }

        // =====================================================================
        // Busca de ativos/tokens — várias fontes em paralelo, cobrindo tanto pares
        // on-chain (DEXs) quanto listagens centralizadas (CEX/agregadores):
        //   • DexScreener    — pares on-chain, qualquer chain/DEX
        //   • GeckoTerminal  — pares on-chain agregados de várias DEXs (inclui Uniswap)
        //   • CoinGecko      — listagem centralizada dos principais coins/tokens
        //   • Binance        — par de negociação na exchange, quando existir
        // Cada fonte devolve resultados normalizados no mesmo formato que o render usa:
        // { baseToken:{name,symbol,address}, chainId, priceUsd, liquidity:{usd}, url, info:{imageUrl}, source }
        // Obs.: a Uniswap não tem API pública de busca sem chave própria; seus pares
        // aparecem via GeckoTerminal, que agrega Uniswap V2/V3 entre outras DEXs.
        // =====================================================================
        async function fetchDexScreenerTokens(qLower, query) {
            try {
                const data = await fetchWithRetry("https://api.dexscreener.com/latest/dex/search?q=" + encodeURIComponent(query));
                const pairs = data.pairs || [];
                const matches = pairs.filter(p =>
                    p.baseToken && (
                        p.baseToken.name.toLowerCase() === qLower ||
                        p.baseToken.symbol.toLowerCase() === qLower ||
                        p.baseToken.address.toLowerCase() === qLower
                    )
                );
                return matches.map(p => Object.assign({}, p, { source: 'dexscreener' }));
            } catch (err) {
                return [];
            }
        }

        async function fetchCoinGeckoTokens(qLower, query) {
            try {
                const data = await fetchWithRetry("https://api.coingecko.com/api/v3/search?query=" + encodeURIComponent(query));
                const coins = (data.coins || []).filter(c =>
                    c.symbol.toLowerCase() === qLower || c.name.toLowerCase() === qLower
                ).slice(0, 3);
                if (!coins.length) return [];
                const ids = coins.map(c => c.id).join(',');
                const priceData = await fetchWithRetry("https://api.coingecko.com/api/v3/simple/price?ids=" + ids + "&vs_currencies=usd&include_24hr_vol=true&include_market_cap=true");
                return coins.filter(c => priceData[c.id]).map(c => ({
                    baseToken: { name: c.name, symbol: c.symbol.toUpperCase(), address: c.id },
                    chainId: 'CoinGecko',
                    priceUsd: priceData[c.id].usd,
                    liquidity: { usd: priceData[c.id].usd_24h_vol || priceData[c.id].usd_market_cap || 0 },
                    url: 'https://www.coingecko.com/en/coins/' + c.id,
                    info: c.large ? { imageUrl: c.large } : {},
                    source: 'coingecko'
                }));
            } catch (err) {
                return [];
            }
        }

        const RERC_POOL_ADDRESS = '0xe958cf100112f01d1639bb786c81f6ed46d1eabb';

        async function fetchRercDirect() {
            try {
                const dexData = await fetch('https://api.dexscreener.com/latest/dex/pairs/polygon/' + RERC_POOL_ADDRESS).then(r => r.json());
                const pair = (dexData.pairs && dexData.pairs[0]) || dexData.pair;
                if (!pair || !pair.priceUsd) return null;
                return {

        async function fetchTokenResults(query) {
            const qLower = query.toLowerCase().trim();
            if (qLower === 'rerc' || qLower === 'rer coin' || qLower === 'rer') {
                const direct = await fetchRercDirect();
                if (direct) return [direct];
            }
            const [dex, cg] = await Promise.all([
                fetchDexScreenerTokens(qLower, query),
                fetchCoinGeckoTokens(qLower, query)
            ]);
            const all = [].concat(dex, cg);
            // Agrupa pelo MESMO token (endereço + rede), não pela fonte — evita mostrar o
            // mesmo token duas vezes quando duas fontes indexam o mesmo par, e fica com a
            // leitura mais confiável (maior liquidez) entre elas.
            const byToken = new Map();
            all.forEach(p => {
                const key = normalize(p.chainId.split(' ')[0]) + '|' + (p.baseToken.address || p.baseToken.symbol).toLowerCase();
                const current = byToken.get(key);
                if (!current || (p.liquidity?.usd || 0) > (current.liquidity?.usd || 0)) {
                    byToken.set(key, p);
                }
            });
            let unique = Array.from(byToken.values());
            // Descarta leitura de preço quebrado/zerado (bug comum de fonte) se houver outra opção
            const withPrice = unique.filter(p => parseFloat(p.priceUsd) > 0);
            if (withPrice.length) unique = withPrice;
            // Ordena por liquidez/volume (mais relevante primeiro).
            unique.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
            // O filtro de liquidez mínima só entra quando há MUITOS resultados (ruído real,
            // tipo "bitcoin" trazendo dezenas de token-ponte). Com poucos resultados — caso
            // de um token pequeno/novo tipo RERC — mostra tudo, mesmo com liquidez baixa.
            if (unique.length > 3) {
                const MIN_LIQUIDITY = 20000;
                const filtered = unique.filter(p => (p.liquidity?.usd || 0) >= MIN_LIQUIDITY);
                return filtered.slice(0, 6);
            }
            return unique;
        }

        // =====================================================================
        // Correção de digitação — "você quis dizer X?" estilo Google, pra erros de
        // digitação tipo "Gekoterminal" -> "geckoterminal", "Coingeko" -> "coingecko".
        // =====================================================================
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            const d = Array.from({ length: m + 1 }, (_, i) => [i].concat(new Array(n).fill(0)));
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    d[i][j] = Math.min(
                        d[i - 1][j] + 1,
                        d[i][j - 1] + 1,
                        d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
                    );
                }
            }
            return d[m][n];
        }

        function correctQuery(q) {
            const qNorm = normalize(q);
            if (CURATED_OFFICIAL_SITES[qNorm]) return q; // já bate exato, não mexe
            const dictionary = Object.keys(CURATED_OFFICIAL_SITES).concat(
                cryptoList.flatMap(c => [c.name, c.symbol])
            );
            let best = null, bestDist = Infinity;
            dictionary.forEach(term => {
                const termNorm = normalize(term);
                const dist = levenshtein(qNorm, termNorm);
                // tolerância proporcional ao tamanho da palavra (evita corrigir palavra curta demais)
                const tolerance = qNorm.length <= 5 ? 1 : 2;
                if (dist <= tolerance && dist < bestDist) { best = term; bestDist = dist; }
            });
            return best || q;
        }

        async function callGeminiWithModel(model, contents) {
            const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + GEMINI_API_KEY, {

                headers: { 'Content-Type': 'application/json' },

                })

            if (!res.ok) {

                throw new Error(data.error?.message || 'erro na chamada');
            }
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
                console.error('Gemini (' + model + ') sem texto na resposta:', data);
                throw new Error('sem resposta da IA');
            }
            return text.trim();
        }

        async function callGemini(messages) {
            const contents = messages.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            }));
            let lastErr = null;
            for (const model of GEMINI_MODELS) {
                try {
                    return await callGeminiWithModel(model, contents);
                } catch (err) {
                    lastErr = err;
                }
            }
            throw lastErr;
        }

        const KNOWN_ASSETS = [
            "Bitcoin", "Ethereum", "Solana", "RERC", "Tether", "BNB", "XRP", "Cardano",
            "Dogecoin", "Tron", "Dólar", "Euro", "Real", "Libra Esterlina", "Iene", "Peso Argentino"

        function hideAutocomplete() {

        function updateAutocomplete(value) {
            const v = normalize(value);
            if (!v) { hideAutocomplete(); return; }
            const pool = KNOWN_ASSETS
                .concat(cryptoList.map(c => c.name))
                .concat(cryptoList.map(c => c.symbol.toUpperCase()))
                .concat(Object.values(WORLD_CURRENCIES));
            const seen = new Set();
            const matches = [];
            for (const a of pool) {
                const aNorm = normalize(a);
                if (aNorm.startsWith(v) && !seen.has(aNorm)) {
                    seen.add(aNorm);
                    matches.push(a);
                    if (matches.length >= 8) break;
                }
            }
            if (!matches.length) { hideAutocomplete(); return; }
            autocompleteDropdown.innerHTML = matches.map(a =>
                '<div class="autocomplete-item" onclick="selectSuggestion(' + JSON.stringify(a).replace(/"/g, '&quot;') + ')">' + escapeHtml(a) + '</div>'
            ).join('');
            autocompleteDropdown.classList.add('active');
        }

        function renderSparkline(svgEl, prices) {
            if (!prices || prices.length < 2) return;
            const w = 100, h = 32;
            const min = Math.min(...prices), max = Math.max(...prices);
            const range = (max - min) || 1;
            const step = w / (prices.length - 1);
            const points = prices.map((p, i) => (i * step).toFixed(2) + ',' + (h - ((p - min) / range) * h).toFixed(2)).join(' ');
            const up = prices[prices.length - 1] >= prices[0];
            svgEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            svgEl.setAttribute('preserveAspectRatio', 'none');
            svgEl.innerHTML = '<polyline points="' + points + '" fill="none" stroke="' + (up ? '#4caf50' : '#e05252') + '" stroke-width="1.5"/>';
        }

        function fillCoinCard(el, { price, changePct, sparkPrices, currency }) {
            el.querySelector('.coin-price').textContent = currency + parseFloat(price).toLocaleString('pt-BR', { maximumFractionDigits: price < 1 ? 6 : 2 });
            const changeEl = el.querySelector('.coin-change');
            const sign = changePct >= 0 ? '+' : '';
            changeEl.textContent = sign + changePct.toFixed(2) + '%';
            changeEl.className = 'coin-change ' + (changePct >= 0 ? 'up' : 'down');
            renderSparkline(el.querySelector('.coin-spark'), sparkPrices);
        }

        async function fetchWithRetry(url, tries) {
            tries = tries || 2;
            for (let i = 0; i < tries; i++) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                } catch (err) { /* tenta de novo */ }
                if (i < tries - 1) await new Promise(r => setTimeout(r, 600));
            }
            throw new Error('falha ao buscar ' + url);
        }

        const FREECURRENCY_API_KEY = "fca_live_hHLw27ybYqTK7nnHyIzwFHwXMDNpr40haYvHEndY";
        const WORLD_CURRENCIES = {
            USD: 'Dólar americano', EUR: 'Euro', BRL: 'Real brasileiro', GBP: 'Libra esterlina',
            JPY: 'Iene japonês', CHF: 'Franco suíço', CAD: 'Dólar canadense', AUD: 'Dólar australiano',
            CNY: 'Yuan chinês', INR: 'Rupia indiana', MXN: 'Peso mexicano', ZAR: 'Rand sul-africano',
            SEK: 'Coroa sueca', NOK: 'Coroa norueguesa', DKK: 'Coroa dinamarquesa', PLN: 'Zloty polonês',
            SGD: 'Dólar de Singapura', HKD: 'Dólar de Hong Kong', KRW: 'Won sul-coreano', TRY: 'Lira turca',
            NZD: 'Dólar neozelandês', CZK: 'Coroa tcheca', HUF: 'Florim húngaro', ILS: 'Shekel israelense',
            THB: 'Baht tailandês', IDR: 'Rupia indonésia', PHP: 'Peso filipino', RON: 'Leu romeno'
        };

        const convFrom = document.getElementById('convFrom');
        const convTo = document.getElementById('convTo');
        const convAmountFrom = document.getElementById('convAmountFrom');
        const convAmountTo = document.getElementById('convAmountTo');
        const convNote = document.getElementById('convNote');

        let cryptoList = [];       // [{id, symbol, name, current_price}, ...] até 250 moedas
        let fiatRatesFromUsd = null; // {EUR: 0.92, BRL: 5.4, ...} — 1 chamada só, reaproveitada

        async function loadCryptoList() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false');
                cryptoList = await res.json();
            } catch (err) { cryptoList = []; }
        }

        async function loadFiatRates() {
            try {
                const res = await fetch('https://api.freecurrencyapi.com/v1/latest?apikey=' + FREECURRENCY_API_KEY);
                const data = await res.json();
                fiatRatesFromUsd = data.data || {};
            } catch (err) { fiatRatesFromUsd = {}; }
        }

        function buildConverterOptions() {
            let html = '<optgroup label="Moedas">';
            Object.keys(WORLD_CURRENCIES).forEach(code => { html += '<option value="' + code + '">' + code + '</option>'; });
            html += '</optgroup><optgroup label="Cripto">';
            cryptoList.forEach(c => {
                html += '<option value="' + c.id + '">' + c.symbol.toUpperCase() + ' — ' + escapeHtml(c.name) + '</option>';
            });
            html += '</optgroup>';
            convFrom.innerHTML = html;
            convTo.innerHTML = html;
            convFrom.value = 'USD';
            convTo.value = 'BRL';
        }

        async function initConverter() {
            await Promise.all([loadCryptoList(), loadFiatRates()]);
            buildConverterOptions();
            runConversion();
        }
        initConverter();

        async function getUsdValueOf(code) {
            const crypto = cryptoList.find(c => c.id === code);
            if (crypto) return crypto.current_price;
            if (code === 'USD') return 1;
            // Se o câmbio não carregou na primeira vez (falha silenciosa), tenta de novo agora.
            if (!fiatRatesFromUsd || Object.keys(fiatRatesFromUsd).length === 0) {
                await loadFiatRates();
            }
            if (fiatRatesFromUsd && typeof fiatRatesFromUsd[code] === 'number') {
                return 1 / fiatRatesFromUsd[code];
            }
            throw new Error('moeda indisponível: ' + code);
        }

        document.getElementById('swapBtn').addEventListener('click', () => {
            const tmp = convFrom.value;
            convFrom.value = convTo.value;
            convTo.value = tmp;
            runConversion();
        });

        async function runConversion() {
            const from = convFrom.value, to = convTo.value;
            const amount = parseFloat(convAmountFrom.value) || 0;
            convNote.textContent = 'Calculando...';
            try {
                const [usdFrom, usdTo] = await Promise.all([getUsdValueOf(from), getUsdValueOf(to)]);
                const result = amount * usdFrom / usdTo;
                convAmountTo.value = result.toLocaleString('pt-BR', { maximumFractionDigits: result < 1 ? 8 : 2 });
                convNote.textContent = 'Cotações de mercado, apenas referência.';
            } catch (err) {
                convNote.textContent = 'Não foi possível converter agora.';
            }
        }
        convFrom.addEventListener('change', runConversion);
        convTo.addEventListener('change', runConversion);
        convAmountFrom.addEventListener('input', runConversion);

        // =====================================================================
        // Voz
        // =====================================================================
        function startVoice() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("Reconhecimento de voz não suportado neste navegador.");
                return;
            }
            const recognition = new SpeechRec();
            const btn = document.getElementById('voiceBtn');
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            btn.classList.add('listening');
            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('searchInput').value = transcript;
                updateSearchIcons(transcript);
                runSearch(transcript);
            };
            recognition.onerror = () => btn.classList.remove('listening');
            recognition.onend = () => btn.classList.remove('listening');
        }

        // =====================================================================
        // Scanner: câmera real, leitura de QR Code e captura de texto
        // =====================================================================
        let scannerStream = null;
        let scanLoopId = null;
        const video = document.getElementById('scannerVideo');
        const canvas = document.getElementById('scannerCanvas');
        const overlay = document.getElementById('scannerOverlay');
        const status = document.getElementById('scannerStatus');

        function startScanner() {
            overlay.classList.add('active');
            status.textContent = "Pedindo acesso à câmera...";
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    scannerStream = stream;
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        status.textContent = "Aponte a câmera para um QR Code ou texto";
                    };
                    video.onerror = () => {
                        status.textContent = "A câmera abriu mas não conseguiu carregar o vídeo. Fecha e tenta de novo.";
                    };
                    video.play().catch(() => {
                        status.textContent = "A câmera não conseguiu iniciar o vídeo (o navegador bloqueou o autoplay).";
                    });
                    scanLoopId = requestAnimationFrame(scanQRLoop);
                })
                .catch((err) => {
                    status.textContent = "Não foi possível acessar a câmera" + (err && err.name ? " (" + err.name + ")" : "") + ".";
                });
        }

        function scanQRLoop() {
            try {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code && code.data) {
                        status.textContent = "QR Code detectado: " + code.data;
                        document.getElementById('searchInput').value = code.data;
                        closeScanner();
                        runSearch(code.data);
                        return;
                    }
                }
            } catch (err) {
                console.error('Erro no loop do scanner:', err);
                // não trava o loop por causa de um frame ruim — continua tentando
            }
            scanLoopId = requestAnimationFrame(scanQRLoop);
        }

        function captureText() {
            if (!video.videoWidth) {
                status.textContent = "A câmera ainda está carregando — espera um instante e tenta de novo.";
                return;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            runOcr(canvas);
        }

        function closeScanner() {
            overlay.classList.remove('active');
            if (scanLoopId) cancelAnimationFrame(scanLoopId);
            if (scannerStream) {
                scannerStream.getTracks().forEach(t => t.stop());
                scannerStream = null;
            }
        }

        // Reduz a imagem antes do OCR — fotos de celular em resolução total deixam o
        // reconhecimento de texto extremamente lento; ~1000px de largura já é suficiente.
        function downscaleForOcr(sourceCanvas, maxWidth) {
            maxWidth = maxWidth || 1000;
            if (sourceCanvas.width <= maxWidth) return sourceCanvas;
            const scale = maxWidth / sourceCanvas.width;
            const small = document.createElement('canvas');
            small.width = maxWidth;
            small.height = Math.round(sourceCanvas.height * scale);
            small.getContext('2d').drawImage(sourceCanvas, 0, 0, small.width, small.height);
            return small;
        }

        function showRecognizedText(text) {
            closeScanner();
            document.getElementById('searchInput').value = text;
            const box = document.createElement('div');
            box.className = 'no-results';
            box.style.textAlign = 'left';
            box.innerHTML =
                '<div style="margin-bottom:8px; opacity:0.7;">Texto reconhecido — toque e segure pra selecionar um pedaço:</div>' +
                '<textarea id="recognizedTextArea" readonly style="width:100%; min-height:90px; background:rgba(255,255,255,0.03); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px; padding:10px; font-family:inherit; font-size:0.95rem; margin-bottom:10px;"></textarea>' +
                '<button class="scanner-btn" id="copyRecognizedBtn">Copiar tudo</button> ' +
                '<button class="scanner-btn" id="searchRecognizedBtn">Buscar</button>';
            resultsContainer.innerHTML = "";
            resultsContainer.appendChild(box);
            document.getElementById('recognizedTextArea').value = text;
            document.getElementById('copyRecognizedBtn').onclick = () => {
                navigator.clipboard.writeText(text).then(() => {
                    document.getElementById('copyRecognizedBtn').textContent = 'Copiado!';
                });
            };
            document.getElementById('searchRecognizedBtn').onclick = () => runSearch(text);
        }

        function runOcr(sourceCanvas) {
            status.textContent = "Lendo texto... 0%";
            const small = downscaleForOcr(sourceCanvas);
            small.toBlob(blob => {
                Tesseract.recognize(blob, 'por', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            status.textContent = "Lendo texto... " + Math.round(m.progress * 100) + "%";
                        }
                    }
                })
                    .then(({ data: { text } }) => {
                        const clean = text.trim();
                        if (clean) {
                            showRecognizedText(clean);
                        } else {
                            status.textContent = "Nenhum QR Code ou texto reconhecido, tente novamente.";
                        }
                    })
                    .catch(() => { status.textContent = "Erro ao ler o texto."; });
            });
        }

        function tryQrThenOcr(sourceCanvas) {
            const ctx = sourceCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                status.textContent = "QR Code detectado: " + code.data;
                closeScanner();
                document.getElementById('searchInput').value = code.data;
                runSearch(code.data);
                return;
            }
            runOcr(sourceCanvas);
        }

        // Escolher imagem da galeria (igual ao quadradinho do Google Lens) em vez de usar a câmera ao vivo
        document.getElementById('galleryInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            status.textContent = "Carregando imagem...";
            const img = new Image();

            const safetyTimeout = setTimeout(() => {
                status.textContent = "Essa imagem demorou demais pra abrir. Tenta uma foto menor ou tira uma nova.";
            }, 12000);

            img.onerror = () => {
                clearTimeout(safetyTimeout);
                status.textContent = "Essa imagem não abriu. Tenta outra.";
                URL.revokeObjectURL(objectUrl);
            };
            img.onload = () => {
                clearTimeout(safetyTimeout);
                URL.revokeObjectURL(objectUrl); // já carregou, não precisa mais guardar
                // Fotos de celular vêm em resolução muito alta (4000px+) — desenhar isso
                // direto no canvas trava navegador mais fraco. Já limita aqui.
                const MAX_DRAW_WIDTH = 1600;
                const scale = img.width > MAX_DRAW_WIDTH ? MAX_DRAW_WIDTH / img.width : 1;
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                tryQrThenOcr(canvas);
            };
            // URL de objeto direta é bem mais leve que converter a foto inteira pra texto
            // base64 primeiro (FileReader) — isso era o provável motivo de travar em foto grande.
            const objectUrl = URL.createObjectURL(file);
            img.src = objectUrl;
            e.target.value = ''; // permite escolher a mesma imagem de novo depois
        });
    </script>
</body>
</html>
