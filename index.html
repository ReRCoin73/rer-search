<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReR Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --border-color: #e8eaed;
            --accent-color: #d4af37;
            --muted-color: #9aa0a6;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #121212;
                --border-color: #121212;
                --accent-color: #b8860b;
                --muted-color: #5f6368;
            }
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10vh;
            margin-bottom: 4px;
        }
        .brand-title {
            font-size: 3.1rem;
            font-weight: bold;
            margin: 0;
        }
        .rer-part { color: var(--accent-color); }
        .slogan {
            font-family: 'Times New Roman', Times, serif;
            color: var(--muted-color);
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin: 2px 0 26px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            border: 1.5px solid var(--border-color);
            border-radius: 28px;
            padding-right: 15px;
            background: rgba(255, 255, 255, 0.03);
        }
        @media (min-width: 900px) { .search-box { max-width: 720px; } }
        @media (max-width: 480px) {
            .search-box { max-width: 92vw; border-radius: 24px; }
            .search-input { padding: 12px 16px; font-size: 1rem; }
            .header-container { margin-top: 7vh; }
            .brand-title { font-size: 2.5rem; }
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 20px;
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
            min-width: 0;
        }
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.listening svg { fill: var(--accent-color); }
        .icon-btn svg { width: 22px; height: 22px; fill: var(--text-color); }

        .home-widgets {
            width: 100%;
            max-width: 600px;
            margin-top: 28px;
        }
        @media (min-width: 900px) { .home-widgets { max-width: 720px; } }
        @media (max-width: 480px) { .home-widgets { max-width: 92vw; } }
        .home-widgets.hidden { display: none; }

        .coin-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 560px) { .coin-row { grid-template-columns: repeat(4, 1fr); } }
        .coin-card {
            position: relative;
            border-radius: 16px;
            padding: 14px 16px;
            background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .coin-card.rerc-card {
            border-color: rgba(212,175,55,0.5);
            background: linear-gradient(160deg, rgba(212,175,55,0.12), rgba(212,175,55,0.02));
        }
        .coin-ticker { font-weight: bold; font-size: 0.92rem; letter-spacing: 0.3px; opacity: 0.95; }
        .coin-price { font-size: 0.78rem; opacity: 0.6; margin-top: 3px; }
        .coin-change { font-size: 1.05rem; font-weight: bold; margin-top: 5px; }
        .coin-change.up { color: #4caf50; }
        .coin-change.down { color: #e05252; }
        .coin-spark { width: 100%; height: 30px; margin-top: 8px; display: block; opacity: 0.9; }

        .converter-box {
            margin-top: 22px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
        }
        .converter-title { font-size: 0.95rem; opacity: 0.75; margin-bottom: 10px; }
        .converter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .converter-row:last-child { margin-bottom: 0; }
        .converter-amount {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }
        .converter-select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            max-width: 42%;
        }
        .converter-select option { color: #000; }
        .converter-note { font-size: 0.75rem; opacity: 0.55; margin-top: 8px; text-align: center; }

        .results-container {
            width: 100%;
            max-width: 600px;
            margin-top: 22px;
        }
        @media (min-width: 900px) { .results-container { max-width: 720px; } }
        @media (max-width: 480px) { .results-container { max-width: 92vw; } }

        .result-link {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 4px;
            margin-bottom: 20px;
            text-decoration: none;
            color: inherit;
        }
        .result-favicon { width: 20px; height: 20px; border-radius: 4px; margin-top: 3px; flex-shrink: 0; }
        .result-info { min-width: 0; flex: 1; }
        .result-name {
            font-weight: bold; font-size: 1.15rem; color: var(--accent-color);
            display: block;
        }
        .result-link:hover .result-name { text-decoration: underline; }
        .result-name .badge-new {
            font-size: 0.6rem; color: var(--bg-color); background: var(--accent-color);
            border-radius: 8px; padding: 2px 7px; margin-left: 8px; vertical-align: middle;
        }
        .result-url { font-size: 0.8rem; opacity: 0.7; word-break: break-all; margin-top: 1px; }
        .result-desc { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
        .no-results { opacity: 0.7; font-size: 0.95rem; text-align: center; }

        .search-wrap { position: relative; width: 100%; max-width: 600px; }
        @media (min-width: 900px) { .search-wrap { max-width: 720px; } }
        @media (max-width: 480px) { .search-wrap { max-width: 92vw; } }
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            z-index: 50;
            display: none;
        }
        .autocomplete-dropdown.active { display: block; }
        .autocomplete-item {
            padding: 11px 18px;
            cursor: pointer;
            font-size: 1rem;
        }
        .autocomplete-item:hover, .autocomplete-item.highlighted { background: rgba(212,175,55,0.12); }

        .scanner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scanner-overlay.active { display: flex; }
        .scanner-video {
            width: min(92vw, 480px);
            max-height: 65vh;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            background: #000;
        }
        .scanner-actions { display: flex; gap: 14px; margin-top: 18px; }
        .scanner-btn {
            font-family: inherit;
            background: transparent;
            border: 1.5px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .scanner-btn:hover { background: rgba(212,175,55,0.12); }
        .scanner-status {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-color);
            max-width: 90vw;
            text-align: center;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="header-container" id="homeLink" onclick="goHome()" style="cursor:pointer;">
        <h1 class="brand-title"><span class="rer-part">ReR</span> Search</h1>
    </div>
    <div class="slogan">Cripto - Câmbio - Token</div>

    <div class="search-wrap">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar ativos, contratos ou tokens..." autocomplete="off">
            <button class="icon-btn" id="voiceBtn" onclick="startVoice()" title="Voz">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.9 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.51-.4-.9-.9-.9s-.9.39-.9.9c0 3.16 2.41 5.76 5.5 6.21V21h2v-3.79c3.09-.45 5.5-3.05 5.5-6.21 0-.51-.41-.9-.9-.9z"/></svg>
            </button>
            <button class="icon-btn" onclick="startScanner()" title="Scanner">
                <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2m16-2h-4v2h4v4h2V5a2 2 0 0 0-2-2M3 19v-4h2v4h4v2H5a2 2 0 0 1-2-2m18 0a2 2 0 0 1-2 2h-4v-2h4v-4h2M7 7h10v10H7V7Z"/></svg>
            </button>
        </div>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
    </div>

    <div class="home-widgets" id="homeWidgets">
        <div class="coin-row" id="coinRow">
            <div class="coin-card" data-coin="bitcoin"><div class="coin-ticker">BTC</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card rerc-card" data-coin="rerc"><div class="coin-ticker">RERC</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card" data-coin="solana"><div class="coin-ticker">SOL</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
            <div class="coin-card" data-coin="ethereum"><div class="coin-ticker">ETH</div><div class="coin-price">--</div><div class="coin-change">--</div><svg class="coin-spark"></svg></div>
        </div>

        <div class="converter-box">
            <div class="converter-title">Conversor</div>
            <div class="converter-row">
                <input type="number" id="convAmountFrom" class="converter-amount" value="1">
                <select id="convFrom" class="converter-select"></select>
            </div>
            <div class="converter-row">
                <input type="number" id="convAmountTo" class="converter-amount" readonly>
                <select id="convTo" class="converter-select"></select>
            </div>
            <div class="converter-note" id="convNote">Cotações de mercado, apenas referência.</div>
        </div>
    </div>

    <div class="results-container" id="resultsContainer"></div>

    <div class="scanner-overlay" id="scannerOverlay">
        <video id="scannerVideo" class="scanner-video" autoplay playsinline muted></video>
        <canvas id="scannerCanvas" style="display:none;"></canvas>
        <div class="scanner-status" id="scannerStatus">Aponte a câmera para um QR Code ou texto</div>
        <div class="scanner-actions">
            <button class="scanner-btn" onclick="captureText()">Capturar texto</button>
            <button class="scanner-btn" onclick="closeScanner()">Fechar</button>
        </div>
    </div>

    <script>
        const SERPER_API_KEY = "32ae43fa233c01d6867bd876d2cb83d9661397d4";
        const resultsContainer = document.getElementById('resultsContainer');
        const homeWidgets = document.getElementById('homeWidgets');

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function normalize(str) {
            return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        function favicon(url, size) {
            try {
                const domain = new URL(url).hostname;
                return 'https://www.google.com/s2/favicons?sz=' + (size || 32) + '&domain=' + domain;
            } catch (e) {
                return '';
            }
        }

        async function fetchWebResults(query) {
            if (!SERPER_API_KEY) return [];
            try {
                const res = await fetch('https://google.serper.dev/search', {
                    method: 'POST',
                    headers: {
                        'X-API-KEY': SERPER_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        q: query,
                        num: 6
                    })
                });
                const data = await res.json();
                return (data.organic || []).map(item => ({
                    url: item.link,
                    title: item.title,
                    content: item.snippet || ''
                }));
            } catch (err) {
                return [];
            }
        }

        function renderWebResult(r) {
            const link = document.createElement('a');
            link.className = 'result-link';
            link.href = r.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const domain = (() => { try { return new URL(r.url).hostname; } catch (e) { return r.url; } })();
            const icon = favicon(r.url);
            link.innerHTML =
                (icon ? '<img src="' + icon + '" class="result-favicon" alt="" loading="lazy">' : '') +
                '<div class="result-info">' +
                    '<span class="result-name">' + escapeHtml(r.title || domain) + '</span>' +
                    '<div class="result-url">' + escapeHtml(domain) + '</div>' +
                    '<div class="result-desc">' + escapeHtml((r.content || '').slice(0, 160)) + '</div>' +
                '</div>';
            resultsContainer.appendChild(link);
        }

        async function fetchTokenResults(query) {
            try {
                const res = await fetch("https://api.dexscreener.com/latest/dex/search?q=" + encodeURIComponent(query));
                const data = await res.json();
                const pairs = (data.pairs || []).slice(0, 3);
                return pairs.map(p => ({
                    baseToken: p.baseToken,
                    chainId: p.chainId,
                    priceUsd: p.priceUsd,
                    liquidity: p.liquidity,
                    url: p.url,
                    info: p.info || {}
                }));
            } catch (err) {
                return [];
            }
        }

        function renderTokenResult(p) {
            const link = document.createElement('a');
            link.className = 'result-link';
            link.href = p.url || '#';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const priceUsd = p.priceUsd ? '$' + parseFloat(p.priceUsd).toLocaleString('pt-BR', {maximumFractionDigits: 6}) : '';
            link.innerHTML =
                '<div class="result-info">' +
                    '<span class="result-name">' + escapeHtml(p.baseToken.name) + ' (' + escapeHtml(p.baseToken.symbol) + ')</span>' +
                    '<div class="result-url">' + escapeHtml(p.chainId) + ' · ' + escapeHtml(p.baseToken.address || '') + '</div>' +
                    '<div class="result-desc">Preço: ' + priceUsd + '</div>' +
                '</div>';
            resultsContainer.appendChild(link);
        }

        function goHome() {
            document.getElementById('searchInput').value = '';
            resultsContainer.innerHTML = "";
            homeWidgets.classList.remove('hidden');
            hideAutocomplete();
        }

        async function runSearch(query) {
            hideAutocomplete();
            if (!query || !query.trim()) {
                goHome();
                return;
            }
            const q = query.trim();
            homeWidgets.classList.add('hidden');
            resultsContainer.innerHTML = '<div class="no-results">Buscando...</div>';

            const [tokenResults, webResults] = await Promise.all([
                fetchTokenResults(q),
                fetchWebResults(q)
            ]);

            resultsContainer.innerHTML = "";

            if (tokenResults.length === 0 && webResults.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">Nenhum resultado encontrado para "' + escapeHtml(q) + '".</div>';
                return;
            }

            tokenResults.forEach(renderTokenResult);
            webResults.forEach(renderWebResult);
        }

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runSearch(e.target.value);
        });

        const KNOWN_ASSETS = ["Bitcoin", "Ethereum", "Solana", "RERC", "Tether", "BNB", "XRP", "Cardano", "Dogecoin", "Dólar", "Euro", "Real"];
        const autocompleteDropdown = document.getElementById('autocompleteDropdown');

        function hideAutocomplete() {
            autocompleteDropdown.classList.remove('active');
            autocompleteDropdown.innerHTML = '';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = normalize(e.target.value);
            if (!val) {
                hideAutocomplete();
                return;
            }
            const matches = KNOWN_ASSETS.filter(a => normalize(a).startsWith(val)).slice(0, 5);
            if (!matches.length) {
                hideAutocomplete();
                return;
            }
            autocompleteDropdown.innerHTML = matches.map(a =>
                '<div class="autocomplete-item" onclick="document.getElementById(\'searchInput\').value=\'' + a + '\'; hideAutocomplete(); runSearch(\'' + a + '\');">' + escapeHtml(a) + '</div>'
            ).join('');
            autocompleteDropdown.classList.add('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrap')) hideAutocomplete();
        });

        function renderSparkline(svgEl, prices) {
            if (!prices || prices.length < 2) return;
            const w = 100, h = 32;
            const min = Math.min(...prices), max = Math.max(...pr
