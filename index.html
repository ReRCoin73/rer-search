<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReR Search - Motor de Busca Cripto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #d1d1d1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        /* Ajuste do tamanho do logo para ficar proporcional */
        .logo-img {
            width: 120px; 
            height: 120px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 2px solid #c5a059; /* Cor dourada da moeda */
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }
        .logo-container h1 {
            font-size: 2.2rem;
            color: #c5a059; /* Dourado da Rer Coin */
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            background: #161616;
            border: 2px solid #333;
            border-radius: 40px;
            overflow: hidden;
            transition: 0.3s;
        }
        .search-box:focus-within {
            border-color: #c5a059;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 18px 25px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
        }
        .search-btn {
            background: #c5a059;
            border: none;
            padding: 0 30px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .search-btn:hover {
            background: #e6b86b;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Substitua 'rer_logo.png' pelo caminho correto do seu arquivo -->
        <img src="rer_logo.png" alt="ReR Coin Logo" class="logo-img">
        <h1>ReR Search</h1>
        <p>Motor de Busca Cripto Descentralizado</p>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" placeholder="Pesquisar ativos, contratos ou tokens...">
        <button class="search-btn">Buscar</button>
    </div>

</body>
</html>
