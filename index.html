<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReR Search</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --border-color: #d3d3d3;
            --accent-color: #d4af37;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Times New Roman', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            margin: 0;
            box-sizing: border-box;
        }
        .user-profile { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 0.95rem; 
        }
        .avatar { 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--accent-color); 
        }
        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 18px; 
            margin-top: 15vh; 
            margin-bottom: 28px; 
        }
        .logo-img { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            border: 2px solid var(--accent-color); 
            object-fit: cover;
        }
        .brand-title { 
            font-size: 2.5rem; 
            font-weight: bold; 
            margin: 0;
        }
        .rer-part { 
            color: var(--accent-color); 
        }
        .search-box { 
            width: 100%; 
            max-width: 500px; 
            display: flex; 
            align-items: center; 
            border: 1.5px solid var(--border-color); 
            border-radius: 28px; 
            padding-right: 15px; 
            background: rgba(255, 255, 255, 0.03);
            box-sizing: border-box;
        }
        .search-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            padding: 14px 20px; 
            color: var(--text-color); 
            font-size: 1.1rem; 
            outline: none; 
        }
        .icon-btn { 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            padding: 6px; 
            opacity: 0.85; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn svg { 
            width: 22px; 
            height: 22px; 
            fill: var(--text-color); 
        }
    </style>
</head>
<body>

    <div class="user-profile">
        <span id="userName">Usuário</span>
        <img src="rer_logo.png" alt="Perfil" class="avatar">
    </div>

    <div class="header-container">
        <img src="rer_logo.png" alt="Logo" class="logo-img">
        <h1 class="brand-title"><span class="rer-part">ReR</span> Search</h1>
        <img src="rer_logo.png" alt="Logo" class="logo-img">
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar ativos, contratos ou tokens...">
        <button class="icon-btn" onclick="startVoice()" title="Voz">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.9 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.51-.4-.9-.9-.9s-.9.39-.9.9c0 3.16 2.41 5.76 5.5 6.21V21h2v-3.79c3.09-.45 5.5-3.05 5.5-6.21 0-.51-.41-.9-.9-.9z"/></svg>
        </button>
        <button class="icon-btn" onclick="startScanner()" title="Scanner">
            <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2m16-2h-4v2h4v4h2V5a2 2 0 0 0-2-2M3 19v-4h2v4h4v2H5a2 2 0 0 1-2-2m18 0a2 2 0 0 1-2 2h-4v-2h4v-4h2M7 7h10v10H7V7Z"/></svg>
        </button>
    </div>

    <script>
        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.start();
            recognition.onresult = (event) => {
                document.getElementById('searchInput').value = event.results[0][0].transcript;
            };
        }

        function startScanner() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    alert("Câmera ativa para leitura de código/contrato.");
                })
                .catch(err => alert("Erro ao acessar a câmera."));
        }
    </script>
</body>
</html>
