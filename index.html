<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Força o navegador a sempre recarregar do zero -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReR Search</title>
    <style>
        :root { --bg-color: #ffffff; --text-color: #202124; --border-color: #3c4043; --accent-color: #d4af37; }
        @media (prefers-color-scheme: dark) { :root { --bg-color: #121212; --text-color: #e8eaed; --border-color: #d3d3d3; } }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .user-profile { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent-color); }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 5vh; margin-bottom: 28px; }
        .brand-title { font-size: 2.5rem; font-weight: bold; }
        .rer-part { color: var(--accent-color); }
        .search-box { width: 100%; max-width: 500px; display: flex; align-items: center; border: 1.5px solid var(--border-color); border-radius: 28px; padding-right: 15px; }
        .search-input { flex: 1; background: transparent; border: none; padding: 12px 20px; color: var(--text-color); font-size: 1.15rem; outline: none; }
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; }
    </style>
</head>
<body>

    <div class="user-profile">
        <span>Usuário</span>
        <div class="avatar"></div>
    </div>

    <div class="header-container">
        <h1 class="brand-title"><span class="rer-part">ReR</span> Search</h1>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar...">
        <button class="icon-btn" onclick="startVoice()">🎤</button>
        <button class="icon-btn" onclick="startScanner()">📷</button>
    </div>

    <script>
        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.start();
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('searchInput').value = text;
                // Simula o Enter da pesquisa
                console.log("Pesquisando por: " + text);
            };
        }

        function startScanner() {
            alert("Scanner inicializado: Use a câmera para ler o código/contrato.");
        }
    </script>
</body>
</html>
